<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    >

    <title>MovieAI</title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

</head>


<body class="view-show">


    <!-- =====================================================
         BACKGROUND
    ====================================================== -->

    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>


    <!-- =====================================================
         NAVBAR
    ====================================================== -->

    <header class="navbar">

        <div
            class="logo"
            id="logoButton"
        >
            Movie<span>AI</span>
        </div>


        <nav class="nav-actions">
            <button id="discoverButton" class="nav-button">
                    Discover
            </button>

            <button
                class="nav-button"
                id="likedButton"
                type="button"
            >

                ♡

                <span>Liked</span>

            </button>


            <button
                class="nav-button"
                id="watchedButton"
                type="button"
            >

                ◷

                <span>Watched</span>

            </button>


            <button
                class="login-button"
                id="loginButton"
                type="button"
            >

                Login

            </button>


        </nav>

    </header>



    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="main-container">


        <!-- =================================================
             MOVIES SECTION
        ================================================== -->

        <section class="movies-section">


            <div class="section-header">


                <div>

                    <div
                        class="section-label"
                        id="moviesLabel"
                    >
                        TMDB
                    </div>


                    <h1 id="moviesTitle">
                        Trending Movies
                    </h1>


                    <p id="moviesDescription">
                        What's popular right now
                    </p>

                </div>


                <div
                    class="movie-count"
                    id="movieCount"
                >
                    10 movies
                </div>

            </div>



            <!-- MOVIE GRID -->

            <div
                id="movieGrid"
                class="movie-grid"
            >

                <!-- Movies inserted by JavaScript -->

            </div>


            <!-- phone only: "3 / 10" under the swipe carousel -->

            <div
                id="carouselCounter"
                class="carousel-counter"
                aria-live="polite"
            ></div>


        </section>



        <!-- =================================================
             CHAT SECTION
        ================================================== -->

        <section class="chat-section">


            <!-- CHAT HEADER -->

            <div class="chat-header">


                <div>

                    <div class="section-label">
                        AI ASSISTANT
                    </div>


                    <h2>
                        Find your next movie
                    </h2>

                </div>


                <div class="ai-status">

                    <span></span>

                    Online

                </div>

            </div>



            <!-- CHAT MESSAGES -->

            <div
                id="chatMessages"
                class="chat-messages"
            >


                <div class="message assistant-message">


                    <div class="message-avatar">
                        AI
                    </div>


                    <div class="message-content">


                        <p>
                            Hey! 👋
                            What kind of movie are you
                            looking for?
                        </p>


                        <div class="suggestions">


                            <button
                                class="suggestion-button"
                                type="button"
                            >
                                Something dark
                            </button>


                            <button
                                class="suggestion-button"
                                type="button"
                            >
                                Action movies
                            </button>


                            <button
                                class="suggestion-button"
                                type="button"
                            >
                                Trending movies
                            </button>


                            <button
                                class="suggestion-button"
                                type="button"
                            >
                                Something emotional
                            </button>


                        </div>


                    </div>


                </div>


            </div>



            <!-- CHAT INPUT -->

            <form
                id="chatForm"
                class="chat-input-container"
            >


                <input
                    id="chatInput"
                    type="text"
                    placeholder="Ask me for a movie..."
                    autocomplete="off"
                >


                <button
                    id="sendButton"
                    type="submit"
                >

                    ➤

                </button>


            </form>


        </section>


    </main>



    <!-- =====================================================
         AUTH MODAL
    ====================================================== -->

    <div
        id="authModal"
        class="modal-overlay hidden"
    >


        <div class="auth-modal">


            <button
                id="closeAuthModal"
                class="modal-close"
                type="button"
            >
                ×
            </button>


            <div class="auth-header">

                <div class="section-label">
                    MOVIEAI
                </div>

                <h2 id="authTitle">
                    Welcome back
                </h2>

                <p id="authDescription">
                    Login to save your favorite movies.
                </p>

            </div>



            <form id="authForm">


                <div class="auth-field">

                    <label for="authEmail">
                        Email
                    </label>

                    <input
                        id="authEmail"
                        type="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>



                <div class="auth-field">

                    <label for="authPassword">
                        Password
                    </label>

                    <input
                        id="authPassword"
                        type="password"
                        placeholder="••••••••"
                        minlength="6"
                        required
                    >

                </div>



                <button
                    id="authSubmit"
                    class="auth-submit"
                    type="submit"
                >
                    Login
                </button>


            </form>



            <div
                id="authError"
                class="auth-error hidden"
            ></div>



            <div class="auth-switch">

                <span id="authSwitchText">
                    Don't have an account?
                </span>

                <button
                    id="authSwitchButton"
                    type="button"
                >
                    Sign up
                </button>

            </div>


        </div>

    </div>




    <!-- =====================================================
         MOBILE BOTTOM TABS (phones only)
    ====================================================== -->

    <nav class="mobile-tabs" aria-label="Views">

        <button
            class="mobile-tab active"
            id="tabMovies"
            type="button"
        >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="16" rx="2"></rect>
                <path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"></path>
            </svg>
            Movies
            <span class="tab-dot"></span>
        </button>

        <button
            class="mobile-tab"
            id="tabChat"
            type="button"
        >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path>
            </svg>
            Chat
        </button>

    </nav>

    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="/js/app.js"></script>


</body>

</html>
